[project]
name = "qqbot"
version = "0.1.0"
description = "qqbot"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "feedparser==6.0.13",
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "httpx>=0.28,<1.0",
    "nonebot-plugin-htmlrender==0.7.2",
    "nonebot-plugin-jrrp3==3.4.0",
    "nonebot-plugin-multi-source-daily==0.3.0",
    "nonebot-plugin-nmcweather==0.1.3"
]

[tool.nonebot]
plugin_dirs = ["qqbot/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
"nonebot-plugin-jrrp3" = ["nonebot_plugin_jrrp3"]
"nonebot-plugin-multi-source-daily" = ["nonebot_plugin_multi_source_daily"]
"nonebot-plugin-nmcweather" = ["nonebot_plugin_nmcweather"]
